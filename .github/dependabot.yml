# Version updates: weekly, grouped so a quiet week is one PR per ecosystem.
# Security updates are separate: Dependabot opens those as soon as an advisory
# lands (repo setting "Dependabot security updates"), independent of this schedule.
# The daily high/critical gate is .github/workflows/audit.yml.
version: 2
updates:
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: "PATCH //"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "PIN //"

  # Base image carries bun's root CA store. Bump deliberately; keep
  # bun-version in ci.yml + audit.yml in step.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "PIN //"
