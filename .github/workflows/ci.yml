# Continuous integration for the Apocalypse EWS Discord bot.
#
# Single job: lint + typecheck + test + bun runtime smoke. The CI pipeline
# is the same `bun run ci` operators run locally, so the green/red signal
# is identical in both places.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel in-flight runs when a branch is force-pushed / new commit lands.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint, typecheck, test
        run: bun run ci
