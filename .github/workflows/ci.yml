# Continuous integration for the Apocalypse EWS Discord bot.
#
# Single job: lint + typecheck + test + bun runtime smoke. The CI pipeline
# is the same `bun run ci` operators run locally, so the green/red signal
# is identical in both places.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel in-flight runs when a branch is force-pushed / new commit lands.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      # Actions pinned to commit SHAs; bun pinned to the Dockerfile runtime.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint, typecheck, test
        run: bun run ci
