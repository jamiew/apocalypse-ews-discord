# Continuous integration for the Apocalypse EWS Discord bot.
#
# One job, one matrix dimension if we ever care: lint + typecheck + test +
# build, all gated by `pnpm ci` so the failure mode is the same locally
# and on GitHub. `biome ci` fails on warnings; tsc --noEmit catches type
# regressions; vitest runs the in-memory SQLite suite; tsc -p
# tsconfig.build.json verifies dist/ compiles cleanly.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel in-flight runs when a branch is force-pushed / new commit lands.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          # Read the pnpm version from packageManager / engines if pinned;
          # otherwise the action defaults to latest. We don't pin, so latest
          # is fine.
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint, typecheck, test, build
        run: pnpm run ci
